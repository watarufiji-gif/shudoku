[build]
  command = "node scripts/generate-pages.js"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  node_bundler_options = { target = "node22", external_node_modules = ["@resvg/resvg-js", "sharp"] }
  included_files = ["assets/fonts/**"]

[functions."send-weekly"]
  schedule = "0 1 * * 6"

[functions."instagram-token-refresh"]
  schedule = "0 3 1 * *"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://syudoku.com"
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
