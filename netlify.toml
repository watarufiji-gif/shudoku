[build]
  command = "node scripts/generate-pages.js"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  node_bundler_options = { target = "node18" }

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://syudoku.com"
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
