[build]
  command = "node scripts/generate-pages.js"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  node_bundler_options = { target = "node22", external_node_modules = ["@resvg/resvg-js", "sharp"] }
  included_files = ["assets/fonts/**"]

[functions."send-weekly"]
  schedule = "0 1 * * 6"

[functions."instagram-token-refresh"]
  schedule = "0 3 1 * *"

[build.environment]
  NODE_VERSION = "22"
  # playwright は devDependencies だが、Netlifyが常にNODE_ENV=productionで
  # devDependenciesを除外するとは限らない（条件付きの挙動のため）。
  # 本体（playwright + playwright-core、あわせて約18MB、インストール数秒程度）は
  # 入る前提で、重いブラウザバイナリ（Chromium/WebKit、数百MB）のダウンロードだけは
  # この変数で確実に止める。
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://syudoku.com"
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
