name: Weekly Email

on:
  schedule:
    # 毎週土曜 9:00 JST（UTC 00:00）
    - cron: '0 0 * * 6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DRY_RUN（trueにするとメール送信しない）'
        required: false
        default: 'false'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Netlify Functions を呼び出す
        env:
          NETLIFY_FUNCTION_URL: ${{ secrets.NETLIFY_FUNCTION_URL }}
          NETLIFY_FUNCTION_SECRET: ${{ secrets.NETLIFY_FUNCTION_SECRET }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-function-secret: ${NETLIFY_FUNCTION_SECRET}" \
            -d "{\"dryRun\": \"${DRY_RUN}\"}" \
            "${NETLIFY_FUNCTION_URL}/.netlify/functions/send-weekly")

          echo "HTTP Status: $HTTP_STATUS"
          cat /tmp/response.txt

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: Function returned $HTTP_STATUS"
            exit 1
          fi
